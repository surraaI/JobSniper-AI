[project]
name = "jobsniper-backend"
version = "0.1.0"
description = "JobSniper AI - Autonomous Job Hunting Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "supabase>=2.10.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "python-telegram-bot>=21.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
